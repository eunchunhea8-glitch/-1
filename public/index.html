<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신화 | 연맹 운영센터</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="auth" class="auth-screen"><div class="auth-art"><div class="crest">神話</div><div class="tiny">GUILD MANAGEMENT</div><h1>신화<br><em>연맹 운영센터</em></h1><p>기록은 투명하게, 보상은 공정하게.<br>우리의 전투를 하나의 기록으로.</p><div class="auth-pills"><span>보스 참여</span><span>포인트</span><span>전리품 분배</span><span>입찰</span></div></div><section class="auth-panel"><div class="mobile-brand">神話 · 신화</div><div class="eyebrow">WELCOME TO SHINHWA</div><h2 id="authTitle">다시 만나서 반갑습니다</h2><p class="muted" id="authText">연맹 계정으로 로그인해 주세요.</p><form id="authForm" class="stack"><label>아이디<input name="username" autocomplete="username" required placeholder="영문·숫자 4자 이상"></label><label id="nickField" hidden>게임 닉네임<input name="nickname" placeholder="게임 내 닉네임"></label><label id="adminCodeField" hidden>최초 운영진 가입코드 (첫 가입자만)<input name="adminCode" autocomplete="off" placeholder="운영진 가입코드"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="8자 이상"></label><button class="primary full" id="authSubmit">로그인</button></form><p id="authSwitch" class="switch">아직 계정이 없나요? <button class="link" type="button" id="toggleAuth">회원가입</button></p><small class="muted">최초 운영진 가입에는 서버에 설정한 가입코드가 필요합니다.</small></section></div>
<div id="app" class="app" hidden><aside class="sidebar"><div class="logo"><div class="logo-icon">神</div><div><b>신화</b><small>GUILD OPERATIONS</small></div></div><div class="nav-caption">WORKSPACE</div><nav id="nav"></nav><div class="sidebar-bottom"><div class="user-mini" id="miniUser"></div><button class="ghost full" id="logout">로그아웃 <span>↗</span></button></div></aside><div class="main"><header class="topbar"><div class="breadcrumb">신화 연맹 <span>/</span> <b id="pageCrumb">대시보드</b></div><div class="topright"><span class="online-dot"></span><span>연맹 관리 시스템</span><span class="avatar" id="topAvatar">神</span></div></header><main id="content" class="content"></main></div></div>
<div id="toast" class="toast" aria-live="polite"></div><script src="/app.js"></script></body></html>
